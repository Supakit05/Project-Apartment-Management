services:
  # Spring Boot REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apartment-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/rooms || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # React + Nginx Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apartment-frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: apartment-network
