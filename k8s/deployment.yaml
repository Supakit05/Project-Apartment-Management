apiVersion: apps/v1
kind: Deployment
metadata:
  name: apartment-backend-deployment
  labels:
    app: apartment-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apartment-backend
  template:
    metadata:
      labels:
        app: apartment-backend
    spec:
      containers:
      - name: backend
        image: apartment-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SERVER_PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: apartment-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apartment-frontend-deployment
  labels:
    app: apartment-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apartment-frontend
  template:
    metadata:
      labels:
        app: apartment-frontend
    spec:
      containers:
      - name: frontend
        image: apartment-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apartment-frontend-service
spec:
  type: NodePort
  selector:
    app: apartment-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
